# E2E Playwright workflow
#
# IMPORTANT: this workflow uses `pull_request` (NOT `pull_request_target`).
# `pull_request_target` would expose secrets to fork PRs and let a malicious
# fork PR exploit ENABLE_TEST_ROUTES against this repo's database. With
# `pull_request`, fork PRs run with a read-only GITHUB_TOKEN.
#
# Initial state: continue-on-error=true, NOT a required check.
# Promotion to required after 14 consecutive green main runs (tracked in #43).

name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: {}

env:
  ENABLE_TEST_ROUTES: '1'
  LLM_PROVIDER: 'mock'
  E2E_MODE: '1'
  NODE_ENV: 'test'
  CI: 'true'

jobs:
  e2e:
    name: Playwright journey smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    # The github-script "Comment on PR with artifact link" step needs to write
    # to issues / pull-requests; default GITHUB_TOKEN read-only for forks plus
    # a hardened branch-protection makes the implicit grant insufficient.
    permissions:
      contents: read
      issues: write
      pull-requests: write

    # Pattern mirrors .github/workflows/bruno-regression.yml:
    #   - postgres user/password = forge/forge (NOT the docker-compose forge_dev value)
    #   - schema applied via `cd packages/server && npm run migrate:up`
    #   - seed applied via `psql -f scripts/seed.sql`
    # Migration 001 already runs `CREATE EXTENSION IF NOT EXISTS uuid-ossp/pg_trgm/unaccent`,
    # so we do NOT need to apply docker/init-db.sql separately.
    #
    # MinIO note: we cannot use `services:` for MinIO because GitHub Actions'
    # `services:` schema has no `command:` field — only env/ports/options.
    # The `minio/minio:latest` image has no default `server /data` command,
    # so without a CMD it just prints help and exits (or runs idle, never
    # binding port 9000). We launch MinIO with an explicit `docker run` step
    # below so we can pass `server /data` and bind the right port.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint guard — testuser is reserved for Bruno
        # Fails fast (before npm ci / heavy setup) if any e2e spec smuggles
        # in a testuser reference. The 'actor' fixture is the only sanctioned
        # way to log in as the worker's primary user; testuser is reserved
        # for Bruno regression tests. See issue #75.
        run: |
          forbidden=$(grep -rEn "(testuser@example\.com|storageStatePath\(['\"]testuser['\"]\)|SEED_USERS\.testuser)" e2e/specs/ || true)
          if [ -n "$forbidden" ]; then
            echo "::error::testuser is reserved for Bruno; e2e specs must use the 'actor' fixture"
            echo "$forbidden"
            exit 1
          fi

      - name: Ensure flaky-e2e label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create flaky-e2e \
            --description "Auto-tracked flaky E2E spec" \
            --color D93F0B || true

      - name: Fixme-budget guard
        # Counts test.fixme(...) calls in e2e/specs. Uses grep -Pzo so the regex
        # matches across newlines (PCRE \s includes \n; -z treats input as one
        # null-terminated record). Satisfies issue #53's failure-mode bullet
        # about multi-line test.fixme( calls.
        env:
          E2E_FIXME_BUDGET: '7'
        run: |
          count=$(grep -Pzro 'test\.fixme\s*\(' e2e/specs/ | tr '\0' '\n' | grep -c 'test\.fixme' || true)
          echo "current test.fixme count: $count"
          echo "current budget: $E2E_FIXME_BUDGET"
          if [ "$count" -gt "$E2E_FIXME_BUDGET" ]; then
            echo "::error::test.fixme budget exceeded ($count > $E2E_FIXME_BUDGET). Drain the queue or raise E2E_FIXME_BUDGET in the workflow file."
            exit 1
          fi

      - name: Fixme-budget regex regression test
        # Asserts the multi-line regex AND the counting pipeline both work.
        # Two fixtures: (a) one multi-line test.fixme(\n(...)) — exercises the
        # regex's `\s*` cross-newline match (PCRE -P plus null-data -z); (b)
        # three single-line test.fixme(...) calls — exercises the counting
        # pipeline (catches `tr -d '\0'` regressions that would collapse all
        # matches into one line).
        run: |
          # Fixture A — multi-line regex
          fixture_a=$(mktemp /tmp/fixme-multiline.XXXXXX.ts)
          cat > "$fixture_a" <<'EOF'
          test.fixme
            ('multi-line should match', async () => {});
          EOF
          got_a=$(grep -Pzro 'test\.fixme\s*\(' "$fixture_a" | tr '\0' '\n' | grep -c 'test\.fixme' || true)
          rm -f "$fixture_a"
          if [ "$got_a" != "1" ]; then
            echo "::error::Multi-line regex regression: expected 1 match in multi-line fixture, got $got_a"
            exit 1
          fi

          # Fixture B — multi-match counting pipeline
          fixture_b=$(mktemp /tmp/fixme-multimatch.XXXXXX.ts)
          cat > "$fixture_b" <<'EOF'
          test.fixme('one', async () => {});
          test.fixme('two', async () => {});
          test.fixme('three', async () => {});
          EOF
          got_b=$(grep -Pzro 'test\.fixme\s*\(' "$fixture_b" | tr '\0' '\n' | grep -c 'test\.fixme' || true)
          rm -f "$fixture_b"
          if [ "$got_b" != "3" ]; then
            echo "::error::Counting pipeline regression: expected 3 matches in 3-line fixture, got $got_b (likely 'tr -d \\0' instead of 'tr \\0 \\n')"
            exit 1
          fi

          echo "Fixme-budget regex regression tests passed (multi-line: 1, multi-match: 3)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @forge/shared
        run: npm run build --workspace=@forge/shared

      - name: Run migrations
        env:
          DATABASE_URL: postgres://forge:forge@localhost:5432/forge
        run: cd packages/server && npm run migrate:up

      - name: Seed database
        env:
          DATABASE_URL: postgres://forge:forge@localhost:5432/forge
        run: psql "$DATABASE_URL" -f scripts/seed.sql

      - name: Build client (production)
        run: npm run build --workspace=@forge/client

      - name: Start MinIO
        # GitHub Actions `services:` has no `command:` field; minio:latest has
        # no default CMD that runs the server. So we launch it explicitly.
        run: |
          docker run -d --name minio \
            -e MINIO_ROOT_USER=forge_minio \
            -e MINIO_ROOT_PASSWORD=forge_minio_secret \
            -p 9000:9000 \
            minio/minio:latest server /data

      - name: Wait for MinIO
        # Poll /minio/health/live from the runner — the minio image lacks
        # curl/wget so a service-level --health-cmd can't work.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready in 60s"
          docker logs minio | tail -50 || true
          exit 1

      - name: Start API server
        env:
          DATABASE_URL: postgres://forge:forge@localhost:5432/forge
          MINIO_ENDPOINT: localhost
          MINIO_PORT: '9000'
          MINIO_ACCESS_KEY: forge_minio
          MINIO_SECRET_KEY: forge_minio_secret
          MINIO_BUCKET: forge-e2e
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          PORT: '3001'
          # HOST=localhost so the API binds same-host as the preview server below.
          # This keeps the refresh_token cookie (sameSite: strict) attachable
          # when the SPA proxies /api/auth/refresh from localhost:4173.
          HOST: 'localhost'
        # MinIO bucket auto-creation: the storage plugin's ensureBucket() runs on
        # server startup (packages/server/src/plugins/storage.ts), which creates
        # the `forge-e2e` bucket if absent. No `mc mb` step needed. If the
        # journey's upload sub-test ever fails with NoSuchBucket, add an explicit
        # bucket-create step here.
        run: |
          mkdir -p "$RUNNER_TEMP"
          cd packages/server
          nohup npx tsx src/server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          # Wait up to 60s for /api/health
          for i in {1..60}; do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Start Vite preview
        run: |
          cd packages/client
          # --host localhost (NOT 127.0.0.1) so the preview origin is same-site
          # with the API origin. See Task 3.5 / playwright.config.ts comments.
          nohup npm run preview -- --port 4173 --host localhost > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview.pid"
          for i in {1..60}; do
            if curl -fsS http://localhost:4173/ >/dev/null 2>&1; then
              echo "Preview ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Install Playwright Chromium
        run: |
          cd e2e
          npx playwright install --with-deps chromium

      - name: Run journey smoke
        env:
          API_URL: http://localhost:3001
          PREVIEW_URL: http://localhost:4173
          MINIO_HEALTH_URL: http://localhost:9000/minio/health/live
        run: npm run e2e -- --reporter=github,html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Auto-flake tracker
        # Skips on fork PRs (GITHUB_TOKEN is read-only on those, POSTs would 403).
        # Skips on burst's workflow_dispatch event (which calls this workflow as
        # reusable). Runs on same-repo PRs and main pushes.
        if: |
          always() &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULTS_JSON: e2e/playwright-report/results.json
          KNOWN_CLASSES: .github/known-flake-classes.json
        # || true ensures a tracker bug never fails the e2e workflow. The script
        # ALSO sets process.exitCode=0 on its own catch block. Errors are
        # surfaced as ::warning:: annotations (visible in the run summary).
        run: npx tsx .github/scripts/e2e-flake-tracker.ts || true

      - name: Sticky-update tracking issue #43 with current fixme count
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          MARKER: '<!-- e2e-fixme-count-sticky -->'
        with:
          script: |
            const { execSync } = require('node:child_process');
            const out = execSync(
              "grep -Pzro 'test\\.fixme\\s*\\(' e2e/specs/ | tr '\\0' '\\n' | grep -c 'test\\.fixme' || true",
              { encoding: 'utf8', shell: '/bin/bash' },
            ).trim();
            const marker = process.env.MARKER;
            const body = `${marker}\n\`test.fixme\` count on \`main\` is **${out}** (budget: 7). Last updated by \`${context.workflow}\` run ${context.runId}.`;

            const issueNumber = 43;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const sticky = existing.find((c) => c.body && c.body.includes(marker));

            if (sticky) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: sticky.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Upload server + preview logs (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/preview.log
          retention-days: 7

      # PR comments use the issues API. The job-level `permissions:` block
      # above explicitly grants `issues: write` + `pull-requests: write`
      # because the default GITHUB_TOKEN grant for `pull_request` is NOT
      # sufficient on this repo (PR #59's first run hit "Resource not
      # accessible by integration").
      - name: Comment on PR with artifact link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              ':red_circle: **E2E Playwright failed.**',
              '',
              `Report artifact: ${runUrl}#artifacts (look for \`playwright-report\`).`,
              `Server logs: \`e2e-server-logs\`.`,
              '',
              '_This check is currently `continue-on-error: true` and does not block merge._',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
